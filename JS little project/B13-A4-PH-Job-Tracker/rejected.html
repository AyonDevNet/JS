
<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interview Jobs</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI -->
    <link
        href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-base-200 min-h-screen">

    <main class="max-w-6xl mx-auto px-5 py-8">

        <!-- Heading -->
        <h1 class="text-2xl font-bold text-blue-950 mb-6">
            Job Application Tracker
        </h1>

        <!-- Dashboard -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">

            <div class="card bg-base-100 shadow-sm">
                <div class="card-body p-4">
                    <p class="text-sm text-gray-500">Total</p>
                    <h2 class="text-2xl font-bold">8</h2>
                </div>
            </div>

            <div class="card bg-base-100 shadow-sm">
                <div class="card-body p-4">
                    <p class="text-sm text-gray-500">Interview</p>
                    <h2 class="text-2xl font-bold text-success">0</h2>
                </div>
            </div>

            <div class="card bg-base-100 shadow-sm">
                <div class="card-body p-4">
                    <p class="text-sm text-gray-500">Rejected</p>
                    <h2 class="text-2xl font-bold text-error">0</h2>
                </div>
            </div>

        </section>

        <div class="divider"></div>

        <!-- Available Jobs -->
        <section>

            <h2 class="text-xl font-bold text-blue-950 mb-5">
                Available Jobs
            </h2>

            <!-- Filter Buttons -->
            <div class="flex gap-2 mb-5">

                <a href="./home_page.html"
                   class="btn btn-outline btn-sm">
                    All
                </a>

                <a href="interview.html"
                   class="btn btn-primary btn-sm">
                    Interview
                </a>

                <a href="rejected.html"
                   class="btn btn-outline btn-sm">
                    Rejected
                </a>

            </div>

            <!-- Empty State -->
            <div class="bg-base-100 rounded-lg p-10 min-h-[250px]
                        flex flex-col justify-center items-center
                        text-center shadow-sm">

                <img
                    src="./jobs.png"
                    alt="Document Icon"
                    class="w-12 h-12 mb-4"
                >

                <h3 class="text-lg font-bold text-gray-800 mb-1">
                    No jobs available
                </h3>

                <p class="text-sm text-gray-400">
                    Check back soon for new job opportunities.
                </p>

            </div>

        </section>

    </main>

</body>
</html>
