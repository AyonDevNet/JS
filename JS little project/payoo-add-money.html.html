        </h1>
        <p class="mt-3 text-base text-base-content/50 leading-snug">
          Enjoy easy and convenient financial services with us. Cashout charge is low and
        </p>

        <!-- Action grid -->
        <div id="actions" class="grid grid-cols-3 gap-3 mt-8">

          <button data-action="Add Money" class="action-card active">
            <span class="icon-slot"><!-- <img src="images/add-money.png" alt="" /> --></span>
            <span class="label">Add Money</span>
          </button>

          <button data-action="Cashout" class="action-card">
            <span class="icon-slot"><!-- <img src="images/cashout.png" alt="" /> --></span>
            <span class="label">Cashout</span>
          </button>

          <button data-action="Transfer Money" class="action-card">
            <span class="icon-slot"><!-- <img src="images/transfer.png" alt="" /> --></span>
            <span class="label">Transfer Money</span>
          </button>

          <button data-action="Get Bonus" class="action-card">
            <span class="icon-slot"><!-- <img src="images/bonus.png" alt="" /> --></span>
            <span class="label">Get Bonus</span>
          </button>

          <button data-action="Pay Bill" class="action-card">
            <span class="icon-slot"><!-- <img src="images/pay-bill.png" alt="" /> --></span>
            <span class="label">Pay Bill</span>
          </button>

          <button data-action="Transactions" class="action-card">
            <span class="icon-slot"><!-- <img src="images/transactions.png" alt="" /> --></span>
            <span class="label">Transactions</span>
          </button>

        </div>
      </div>
    </section>

    <!-- ===== Add Money form ===== -->
    <section class="px-6 pt-6 pb-12">
      <h2 id="section-title" class="text-lg font-semibold mb-4">Add Money</h2>

      <form class="card bg-base-100 rounded-3xl shadow-none">
        <div class="card-body p-6 gap-5">

          <label class="form-control w-full">
            <span class="label-text font-medium text-base-content/80 mb-2 text-base">Select A Bank</span>
            <select class="select w-full h-14 rounded-full bg-base-200 border-0 text-base text-base-content/50 focus:outline-primary" required>
              <option disabled selected>Select bank</option>
              <option>Dutch-Bangla Bank</option>
              <option>Islami Bank</option>
              <option>BRAC Bank</option>
              <option>City Bank</option>
            </select>
          </label>

          <label class="form-control w-full">
            <span class="label-text font-medium text-base-content/80 mb-2 text-base">Bank Account Number</span>
            <input type="text" inputmode="numeric" maxlength="11" placeholder="Enter 11 digit account number"
              class="input w-full h-14 rounded-full bg-base-200 border-0 text-base focus:outline-primary" required />
          </label>

          <label class="form-control w-full">
            <span class="label-text font-medium text-base-content/80 mb-2 text-base">Amount to Add</span>
            <input type="number" min="1" placeholder="Add Amount to withdraw"
              class="input w-full h-14 rounded-full bg-base-200 border-0 text-base focus:outline-primary" required />
          </label>

          <label class="form-control w-full">
            <span class="label-text font-medium text-base-content/80 mb-2 text-base">Pin Number</span>
            <input type="password" inputmode="numeric" maxlength="4" placeholder="Enter 4 digit pin number"
              class="input w-full h-14 rounded-full bg-base-200 border-0 text-base focus:outline-primary" required />
          </label>

          <button type="submit" class="btn btn-primary w-full h-14 min-h-0 rounded-full text-lg font-semibold normal-case">
            Add Money
          </button>

        </div>
      </form>
    </section>
  </div>

  <script>
    // Switch active card + section title
    const cards = document.querySelectorAll('.action-card');
    const title = document.getElementById('section-title');
    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        title.textContent = card.dataset.action;
      });
    });
  </script>
</body>
</html>
