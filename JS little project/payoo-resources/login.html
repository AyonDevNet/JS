
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Login</title>

    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- DaisyUI and Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Global font style -->
    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">

    <div class="w-[200px] mx-auto pt-30">
        <img src="./assets/Logo-full.png" alt="Payoo Logo">
    </div>

    <!-- loggin form  -->
    <div class="form pt-10 ">
        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto rounded-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label text-neutral font-bold">Mobile Number</label>
          <input id="input_mobile" type="text" maxlength="11" minlength="11" class="input rounded-full" placeholder="Mobile Number" />
          <br>
          <label class="label text-neutral font-bold">4 digit pin</label>
          <input  id="Pin_Number" maxlength="4" type="password" class="input rounded-full" placeholder="Password" />
          <div><a class="link link-hover">Forgot password?</a></div>
          <button id="login_btn" class="btn btn-primary mt-4 rounded-full">Login</button>
        </fieldset>
      </div>
    </div>
  </div>
    </div>

</body>
<script src="./script js/login.js"></script>
</html>
