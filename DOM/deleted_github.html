<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Type Deleted</h3>
    <input type="text" name="" id="input_value">
    <button disabled id="deleted">Delete</button>
</body>
      
<script>
     document.getElementById("input_value").addEventListener("keyup",function(event){
        const text = event.target.value;
        console.log("the value is : ",text)

        const deletedbtn = document.getElementById("deleted")
        if(text === "delete" || deletedbtn === "Delete")
     {
         deletedbtn.removeAttribute('disabled')
     }
     else{

          deletedbtn.setAttribute("disable", true);
     }
     })
</script>

</html>
